[package]
name = "claude-codex-usage-monitor"
version = "1.3.1"
edition = "2021"
license = "MIT"
description = "Claude & Codex usage monitor for the Windows taskbar"
repository = "https://github.com/niaz-ahamed77/claude-codex-usage-monitor"

[package.metadata.winres]
CompanyName = "Chinzoe"
ProductName = "Claude & Codex Usage Monitor"
FileDescription = "Claude & Codex Usage Monitor"
OriginalFilename = "claude-codex-usage-monitor.exe"
InternalName = "ClaudeCodexUsageMonitor"
Comments = "https://github.com/Ch1nzo/claude-codex-usage-monitor"
LegalCopyright = "Copyright (C) 2026 Chinzoe. Based on Claude Code Usage Monitor (C) 2025 Craig Constable. MIT License."

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Foundation_Numerics",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
